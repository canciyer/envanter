[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envanter"
version = "0.1.0"
description = "Conservative PUBG Mobile inventory video recognition bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
envanter = "envanter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
